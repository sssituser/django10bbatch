<!DOCTYPE html>
{%load static%}
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">
</head>
<body>
        <div class="container mt-5">
            <div class="row justify-content-center">
                    <div class="col-sm-5">
                        <div class="card">

                            <div class="card-header bg-danger text-white text-center">
                                <p class="h1">Register Here</p>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <input type="number" class="form-control" placeholder="Employe ID">
                                </div>
                                 <div class="mb-3">
                                    <input type="text" class="form-control" placeholder="Employe Name">
                                </div>
                                 <div class="mb-3">
                                    <input type="number" class="form-control" placeholder="Employe Salary">
                                </div>
                            </div>

                            <div class="card-footer">
                                <button class="btn btn-primary w-100 mb-3">Add</button>
                                 <button class="btn btn-warning float-right w-100">No</button>
                            </div>

                        </div>
                    </div>
            </div>
        </div>
</body>
</html>
