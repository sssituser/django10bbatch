<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <p class="h2 mb-3 text-center">Employees Inforamtion</p>
         {%if emps %}
            <table class="table table-bordered text-center">
                <thead >
                    <tr >
                        <th class="bg-primary">EmployeeId</th>
                        <th class="bg-primary">EmployeeName</th>
                        <th class="bg-primary">EmployeeSalary</th>
                        <th class="bg-primary">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {%for emp in emps%}
                        <tr>
                            <td>{{emp.EmployeeId}}</td>
                            <td>{{emp.EmployeeName}}</td>
                            <td>{{emp.EmployeeSalary}}</td>
                            <td>
                                <a href="#">Details</a> |
                                <a href="#">Edit</a>    |
                                <a href="#">Delete</a>
                            </td>
                        </tr>
                    {%endfor%}
                </tbody>
            </table>
         {%else%}
            <p class="h1 text-danger text-center">Records Not Found</p>
         {%endif%}
    </div>
</body>
</html>
