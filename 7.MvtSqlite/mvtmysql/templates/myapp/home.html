<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Home</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
</head>
<body>
    <div class="container">
        <p class="h1 text-center text-danger mb-5">Employees Information</p>
        {%if emps%}
            <table class="table table-bordered table-striped table-hover text-center">
                <thead>
                    <tr>
                        <th class="bg-primary text-white">Employee ID</th>
                        <th class="bg-primary text-white">Employee Name</th>
                        <th class="bg-primary text-white">Employee Salary</th>
                        <th class="bg-primary text-white">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {%for emp in emps%}
                        <tr>
                            <td>{{emp.EmployeeId}}</td>
                            <td>{{emp.EmployeeName}}</td>
                            <td>{{emp.EmployeeSalary}}</td>
                            <td>
                                <a href="#">
                                    <i class="fa fa-eye fa-2x text-primary"></i>
                                </a>
                                <a href="#">
                                    <i class="fa fa-pen fa-2x text-warning"></i>
                                </a>
                                <a href="#">
                                    <i class="fa fa-trash-alt fa-2x text-danger"></i>
                                </a>
                            </td>
                        </tr>
                    {%endfor%}
                </tbody>
            </table>
        {%else%}
            <p class="h1 text-danger text-center">Records Not Found</p>
        {%endif%}

    </div>
</body>
</html>
